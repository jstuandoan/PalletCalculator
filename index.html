<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#2563eb">
<title>Pallet Quantity Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:18px 14px 36px}.head{display:flex;align-items:center;gap:12px;margin:4px 0 18px}.icon{display:grid;place-items:center;width:52px;height:52px;border-radius:17px;background:#2563eb;color:#fff;font-size:27px}.head h1{font-size:25px;margin:0}.head p{margin:3px 0 0;color:#64748b;font-size:14px}.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 10px 28px rgba(15,23,42,.08);margin-bottom:18px}.field{margin-bottom:17px}label{display:block;margin-bottom:7px;font-size:14px;font-weight:750;color:#334155}input{width:100%;border:1px solid #cbd5e1;border-radius:16px;padding:15px 16px;font-size:21px;font-weight:750;background:#fff;outline:none}input:focus{border-color:#2563eb;box-shadow:0 0 0 4px #dbeafe}.result{background:#2563eb;color:#fff;border-radius:22px;padding:22px;text-align:center}.result .label{font-size:12px;font-weight:800;color:#dbeafe;letter-spacing:.08em}.total{font-size:48px;line-height:1.1;font-weight:900;margin:8px 0}.formula{font-size:14px;color:#dbeafe}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}button{min-height:48px;border-radius:15px;border:1px solid #cbd5e1;background:#fff;font-size:16px;font-weight:800;cursor:pointer}.primary{background:#2563eb;border-color:#2563eb;color:#fff}.history-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.history-head h2{font-size:19px;margin:0}.sub{font-size:12px;color:#64748b;margin-top:3px}.mini-actions{display:flex;gap:7px}.small{min-height:38px;padding:0 11px;font-size:13px}.csv{color:#047857}.danger{color:#dc2626}.empty{text-align:center;background:#f8fafc;color:#64748b;padding:20px;border-radius:16px;margin-top:14px;font-size:14px}.list{margin-top:14px;max-height:390px;overflow:auto}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #e2e8f0;border-radius:16px;padding:13px;margin-bottom:9px}.meta{font-size:11px;color:#94a3b8;font-weight:700}.expr{margin-top:4px;font-size:14px;color:#475569}.qty{font-size:25px;color:#2563eb;font-weight:900;white-space:nowrap}.foot{text-align:center;color:#64748b;font-size:12px}@media(max-width:370px){.history-head{display:block}.mini-actions{margin-top:10px}.total{font-size:42px}}
</style>
</head><body><main class="wrap">
<div class="head"><div class="icon">▣</div><div><h1>Pallet Quantity</h1><p>Tính tổng số lượng trên pallet</p></div></div>
<section class="card">
<div class="field"><label for="cartons">Số thùng chẵn</label><input id="cartons" type="number" min="0" inputmode="numeric" placeholder="Ví dụ: 20"></div>
<div class="field"><label for="perCarton">Số lượng trong mỗi thùng</label><input id="perCarton" type="number" min="0" inputmode="numeric" placeholder="Ví dụ: 24"></div>
<div class="field"><label for="loose">Số lẻ</label><input id="loose" type="number" min="0" inputmode="numeric" placeholder="Ví dụ: 10"></div>
<div class="result"><div class="label">TỔNG SỐ LƯỢNG PALLET</div><div id="total" class="total">0</div><div id="formula" class="formula">0 × 0 + 0 = 0</div></div>
<div class="actions"><button type="button" class="primary" onclick="saveCalculation()">💾 Lưu</button><button type="button" onclick="resetInputs()">↻ Reset</button></div>
</section>
<section class="card"><div class="history-head"><div><h2>Lịch sử tính toán</h2><div class="sub">Lưu offline trên thiết bị này</div></div><div class="mini-actions"><button type="button" class="small csv" onclick="exportCSV()">⬇ CSV</button><button type="button" class="small danger" onclick="clearHistory()">🗑 Xóa hết</button></div></div><div id="history"></div></section>
<div class="foot">Công thức: Số thùng chẵn × Số lượng/thùng + Số lẻ</div>
</main>
<script>
const KEY='palletHistory'; const ids=['cartons','perCarton','loose'];
const el=id=>document.getElementById(id); const num=id=>Math.max(0,Number(el(id).value)||0); const fmt=n=>Number(n).toLocaleString('en-US');
function calculate(){const a=num('cartons'),b=num('perCarton'),c=num('loose'),t=a*b+c;el('total').textContent=fmt(t);el('formula').textContent=`${a} × ${b} + ${c} = ${fmt(t)}`;return {a,b,c,t}}
ids.forEach(id=>{ el(id).addEventListener('input',calculate); el(id).addEventListener('change',calculate); el(id).addEventListener('keyup',calculate); });
function getHistory(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}}
function setHistory(h){localStorage.setItem(KEY,JSON.stringify(h));renderHistory()}
function saveCalculation(){if(ids.every(id=>el(id).value===''))return;const {a,b,c,t}=calculate();const h=getHistory();h.unshift({id:Date.now(),fullCartons:a,qtyPerCarton:b,looseQty:c,total:t,time:new Date().toLocaleString('vi-VN')});setHistory(h)}
function resetInputs(){ids.forEach(id=>el(id).value='');calculate();el('cartons').focus()}
function clearHistory(){if(!getHistory().length)return;if(confirm('Xóa toàn bộ lịch sử tính toán?'))setHistory([])}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderHistory(){const h=getHistory(),box=el('history');if(!h.length){box.innerHTML='<div class="empty">Chưa có lịch sử.</div>';return}box.innerHTML='<div class="list">'+h.map((x,i)=>`<div class="item"><div><div class="meta">#${h.length-i} • ${escapeHtml(x.time)}</div><div class="expr">${x.fullCartons} × ${x.qtyPerCarton} + ${x.looseQty}</div></div><div class="qty">${fmt(x.total)}</div></div>`).join('')+'</div>'}
function csvCell(v){return '"'+String(v).replace(/"/g,'""')+'"'}
function exportCSV(){const h=getHistory();if(!h.length){alert('Chưa có lịch sử để xuất.');return}const header=['STT','Thời gian','Số thùng chẵn','Số lượng mỗi thùng','Số lẻ','Tổng số lượng'];const rows=[...h].reverse().map((x,i)=>[i+1,x.time,x.fullCartons,x.qtyPerCarton,x.looseQty,x.total]);const csv=[header,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Pallet_History_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
calculate();renderHistory();
let lastValues=''; setInterval(()=>{const now=ids.map(id=>el(id).value).join('|'); if(now!==lastValues){lastValues=now;calculate();}},250);
</script></body></html>
